name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chatforge
          POSTGRES_PASSWORD: chatforge
          POSTGRES_DB: chatforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chatforge" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://chatforge:chatforge@localhost:5432/chatforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Tests (Postgres)
        run: pytest -q
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
