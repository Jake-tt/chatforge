name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # backend/frontend are required checks, so they must report on every PR.
  # A job skipped by `if` counts as passing; a workflow skipped by `paths` never reports.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  # Always runs: check --strict-paths also validates doc_refs (plan/, decision-docs/).
  decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Decision tooling tests
        run: pytest -q scripts
      - name: Decision map points at real files and test cases
        run: python scripts/decisions.py check --strict-paths --strict-names

  backend:
    needs: changes
    # Runs when the filter could not decide (changes failed), so a broken filter never passes as skipped.
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    # The default is 6 hours: a hung test would hold the runner (and the PR) that long.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chatforge
          POSTGRES_PASSWORD: chatforge
          POSTGRES_DB: chatforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chatforge" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://chatforge:chatforge@localhost:5432/chatforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Tests (Postgres)
        run: pytest -q
        # faulthandler_timeout (pyproject) dumps every thread's stack first, so the log
        # shows where a hung test is stuck.
        timeout-minutes: 10
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

  frontend:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
