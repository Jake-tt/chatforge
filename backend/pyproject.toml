[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chatforge-backend"
version = "0.1.0"
description = "Multi-tenant AI chat backend: guest-to-member migration, token quotas, SSE streaming"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "redis>=5.2",
    # Not imported directly, but the answering model's `fallbacks` parameter needs it:
    # langchain-anthropic alone would allow an SDK that predates it.
    "anthropic>=1.13",
    "langchain-core>=1.7",
    "langchain-anthropic>=1.7",
    "langchain-ollama>=1.1",
    "langgraph>=1.2",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
gcp = ["google-cloud-tasks>=2.19", "google-auth>=2.35", "requests>=2.32"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "fakeredis>=2.26", "aiosqlite>=0.20", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic
